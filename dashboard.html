<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0efeb;--surface:#fff;--s2:#f5f4f1;
  --b1:rgba(0,0,0,.07);--b2:rgba(0,0,0,.13);
  --t1:#111;--t2:#555;--t3:#999;
  --accent:#3730a3;--accent2:#5850c8;
  --danger:#dc2626;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1d2125;--surface:#252a2f;--s2:#2c3138;
    --b1:rgba(255,255,255,.07);--b2:rgba(255,255,255,.13);
    --t1:#e6e4de;--t2:#9a9790;--t3:#5a5855;
  }
}
html,body{height:100%;font-family:'Geist',system-ui,sans-serif;background:var(--bg);color:var(--t1)}
a{text-decoration:none;color:inherit}

.nav{height:54px;display:flex;align-items:center;padding:0 28px;gap:12px;background:var(--surface);border-bottom:1px solid var(--b1);position:sticky;top:0;z-index:50}
.nav-logo{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:-.02em}
.nav-logo-icon{width:28px;height:28px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.nav-logo-icon svg{width:14px;height:14px}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.store-note{font-size:11.5px;color:var(--t3);padding:4px 10px;border:1px solid var(--b1);border-radius:20px;background:var(--s2);white-space:nowrap}

.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--b2);background:var(--surface);color:var(--t1);cursor:pointer;transition:background .12s;font-family:'Geist',sans-serif}
.btn:hover{background:var(--s2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn svg{width:14px;height:14px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.main{max-width:1100px;margin:0 auto;padding:36px 28px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.page-title{font-size:20px;font-weight:700;letter-spacing:-.02em}
.page-sub{font-size:13px;color:var(--t3);margin-top:2px}

/* переключатель разделов Studio */
.seg{display:inline-flex;border:1px solid var(--b2);border-radius:10px;overflow:hidden;margin-bottom:24px}
.seg button{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;font-size:13px;font-weight:600;background:var(--surface);color:var(--t2);border:none;cursor:pointer;font-family:'Geist',sans-serif;transition:background .12s,color .12s}
.seg button+button{border-left:1px solid var(--b2)}
.seg button.on{background:var(--accent);color:#fff}
.seg button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg .count{font-size:11px;opacity:.75;font-weight:600}

/* превью хаба на карточке */
/* Все элементы с flex-shrink:0 — иначе flex-контейнер сжимает
   полоски в ноль, когда секций больше, чем влезает в 140px. */
.hub-prev{padding:14px 15px;display:flex;flex-direction:column;gap:7px;height:100%;overflow:hidden;background:linear-gradient(160deg,var(--s2),var(--surface))}
.hub-prev>*{flex-shrink:0}
.hub-prev .hp-kick{width:52px;height:5px;border-radius:3px;background:var(--accent);opacity:.75}
.hub-prev .hp-h1{width:78%;height:11px;border-radius:4px;background:var(--t3);opacity:.55}
.hub-prev .hp-row{display:flex;gap:6px;margin-top:2px;height:22px}
.hub-prev .hp-tile{flex:1;border-radius:5px;background:var(--surface);border:1px solid var(--b1)}
.hub-prev .hp-bar{width:4px;border-radius:2px;flex-shrink:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}

.diag-card{background:var(--surface);border:1px solid var(--b1);border-radius:14px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .15s,border-color .15s;position:relative}
.diag-card:hover{box-shadow:0 4px 24px rgba(0,0,0,.1);transform:translateY(-2px);border-color:var(--b2)}
.card-preview{height:140px;background:var(--s2);border-bottom:1px solid var(--b1);position:relative;overflow:hidden}
.card-body{padding:13px 15px 14px}
.card-title{font-size:13.5px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.card-meta{font-size:11.5px;color:var(--t3)}
.card-actions{position:absolute;top:10px;right:10px;display:none;gap:5px}
.diag-card:hover .card-actions{display:flex}
.card-act-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--b2);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s}
.card-act-btn:hover{background:var(--s2)}
.card-act-btn svg{width:13px;height:13px;fill:none;stroke:var(--t2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card-act-btn.del:hover{background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.25)}
.card-act-btn.del:hover svg{stroke:var(--danger)}

.new-card{background:var(--surface);border:1.5px dashed var(--b2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:200px;cursor:pointer;transition:border-color .15s,background .15s;color:var(--t3);font-size:13px;font-weight:500}
.new-card:hover{border-color:var(--accent2);background:rgba(88,80,200,.04);color:var(--accent2)}
.new-card-icon{width:42px;height:42px;border-radius:11px;background:var(--s2);display:flex;align-items:center;justify-content:center;transition:background .15s}
.new-card:hover .new-card-icon{background:rgba(88,80,200,.1)}
.new-card-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.empty{text-align:center;padding:80px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-icon{width:56px;height:56px;border-radius:14px;background:var(--s2);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.empty-icon svg{width:28px;height:28px;fill:none;stroke:var(--t3);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty-title{font-size:16px;font-weight:600;color:var(--t1)}
.empty-sub{font-size:13px;color:var(--t3);max-width:280px;line-height:1.6}


.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--t3);font-size:13px;gap:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:18px;height:18px;border:2px solid var(--b2);border-top-color:var(--accent2);border-radius:50%;animation:spin .8s linear infinite}

.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal-ov.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--b2);border-radius:16px;width:100%;max-width:400px;padding:24px;box-shadow:0 16px 60px rgba(0,0,0,.2)}
.modal-title{font-size:15px;font-weight:700;margin-bottom:6px}
.modal-sub{font-size:13px;color:var(--t2);margin-bottom:20px;line-height:1.5}
.modal-input{width:100%;padding:9px 12px;border:1px solid var(--b2);border-radius:8px;background:var(--s2);color:var(--t1);font-family:'Geist',sans-serif;font-size:13.5px;outline:none;margin-bottom:16px;transition:border-color .15s}
.modal-input:focus{border-color:var(--accent2)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--t1);color:var(--bg);padding:9px 18px;border-radius:10px;font-size:12.5px;font-weight:500;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:90vw}
.toast.show{opacity:1}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
@media(max-width:640px){
  .nav{padding:0 14px}
  .nav-logo{font-size:12.5px}
  .main{padding:20px 14px}
  .page-head{flex-direction:column;align-items:flex-start;gap:12px}
  .grid{grid-template-columns:1fr}
  .new-card{min-height:120px}
  }
</style>
</head>
<body>

<div id="app-view">
  <nav class="nav">
    <div class="nav-logo">
      <div class="nav-logo-icon">
        <svg viewBox="0 0 32 32" fill="none">
          <rect x="10" y="3" width="12" height="9" rx="2.5" fill="white" opacity=".9"/>
          <rect x="2" y="16" width="12" height="9" rx="2.5" fill="white" opacity=".8"/>
          <rect x="18" y="16" width="12" height="9" rx="2.5" fill="white" opacity=".8"/>
        </svg>
      </div>
      Studio
    </div>
    <div class="nav-right">
      <span class="store-note" id="store-note" title="Данные не покидают этот браузер"></span>
      <button class="btn" onclick="document.getElementById('file-in').click()" title="Открыть .json со схемой, хабом или резервной копией">
        <svg viewBox="0 0 24 24"><path d="M3 15v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/><path d="m7 8 5-5 5 5M12 3v12"/></svg>

      </button>
      <button class="btn" onclick="exportAll()" title="Скачать все документы одним файлом">
        <svg viewBox="0 0 24 24"><path d="M3 15v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></svg>

      </button>
    </div>

  <div class="main">

        Схемы <span class="count" id="cnt-charts"></span>
      </button>
      <button data-kind="hubs" onclick="switchKind('hubs')">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1.5"/><rect x="3" y="11" width="8" height="9" rx="1.5"/><rect x="13" y="11" width="8" height="9" rx="1.5"/></svg>
        Хабы <span class="count" id="cnt-hubs"></span>
      </button>
    </div>

    <div class="page-head">
      <div>
        <div class="page-title" id="page-title">Мои схемы</div>
        <div class="page-sub" id="page-sub">Загрузка...</div>
      </div>
      <button class="btn primary" id="new-btn" onclick="createCurrent()">
        <svg viewBox="0 0 13 13"><path d="M6.5 1v11M1 6.5h11"/></svg>
        Новая схема
      </button>
    </div>

    <div id="loading" class="loading"><div class="spinner"></div> Загрузка...</div>
    <div id="empty" class="empty" style="display:none">
      <div class="empty-icon" id="empty-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="6" rx="1.5"/><rect x="13" y="3" width="8" height="6" rx="1.5"/><rect x="8" y="14" width="8" height="6" rx="1.5"/></svg>
      </div>
      <div class="empty-title" id="empty-title">Схем пока нет</div>
      <div class="empty-sub" id="empty-sub">Нажмите «Новая схема» чтобы создать первую org-chart</div>
      <button class="btn primary" onclick="createCurrent()" style="margin-top:8px">
        <svg viewBox="0 0 13 13"><path d="M6.5 1v11M1 6.5h11"/></svg>
        Создать
      </button>
    </div>
    <div id="grid" class="grid" style="display:none"></div>
  </div>
</div>

<div class="modal-ov" id="rename-modal">
  <div class="modal">
    <div class="modal-title">Переименовать</div>
    <div class="modal-sub">Введите новое название схемы</div>
    <input class="modal-input" id="rename-input" type="text" placeholder="Название схемы" maxlength="80">
    <div class="modal-btns">
      <button class="btn" onclick="closeRename()">Отмена</button>
      <button class="btn primary" onclick="confirmRename()">Сохранить</button>
    </div>
  </div>
</div>

<input type="file" id="file-in" accept=".json,application/json" style="display:none">
<div class="toast" id="toast"></div>

<script>
/* ═══ Локальное хранилище ══════════════════════════════════
   Документы лежат в localStorage этого браузера: индекс
   отдельно от тел, чтобы список открывался без разбора всего.
   Наружу ничего не уходит — обмен и бэкапы идут файлами. */
const LS_INDEX = 'studio:index';
const LS_DOC = 'studio:doc:';

function lsRead(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function lsWrite(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { return false; }
}
function docIndex() { const ix = lsRead(LS_INDEX, []); return Array.isArray(ix) ? ix : []; }
function docBody(id) { return lsRead(LS_DOC + id, null); }
function newId() { return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function putDoc(id, docKind, title, body) {
  if (!lsWrite(LS_DOC + id, body)) {
    toast('Не хватает места в браузере — выгрузите резервную копию и удалите лишнее');
    return false;
  }
  const ix = docIndex(), now = Date.now();
  const row = ix.filter(function (d) { return d.id === id; })[0];
  if (row) { row.title = title; row.updated = now; }
  else ix.unshift({ id: id, kind: docKind, title: title, created: now, updated: now });
  return lsWrite(LS_INDEX, ix);
}
function dropDoc(id) {
  try { localStorage.removeItem(LS_DOC + id); } catch (e) {}
  lsWrite(LS_INDEX, docIndex().filter(function (d) { return d.id !== id; }));
}

let diagrams = [];
let hubs = [];
let kind = 'charts';
let renameId = null;

function switchKind(k) {
  kind = k;
  document.querySelectorAll('#seg-kind button').forEach(function (b) {
    b.classList.toggle('on', b.getAttribute('data-kind') === k);
  });
  const chart = k === 'charts';
  document.getElementById('page-title').textContent = chart ? 'Мои схемы' : 'Мои хабы';
  document.getElementById('new-btn').lastChild.textContent = chart ? ' Новая схема' : ' Новый хаб';
  document.getElementById('empty-title').textContent = chart ? 'Схем пока нет' : 'Хабов пока нет';
  document.getElementById('empty-sub').textContent = chart
    ? 'Нажмите «Новая схема» чтобы создать первую org-chart'
    : 'Хаб — это страница-агрегатор со ссылками, плитками и контактами';
  try { localStorage.setItem('studio:kind', k); } catch (e) {}
  render();
}

function createCurrent() {
  if (kind === 'charts') createDiagram(); else createHub();
}

function loadAll() {
  const ix = docIndex().slice().sort(function (a, b) { return b.updated - a.updated; });
  diagrams = []; hubs = [];
  ix.forEach(function (row) {
    const body = docBody(row.id);
    if (!body) return;                       /* тело потерялось — строку не показываем */
    if (row.kind === 'hub') {
      hubs.push({ id: row.id, title: row.title, updated_at: row.updated, doc: body });
    } else {
      diagrams.push({ id: row.id, title: row.title, updated_at: row.updated,
                      nodes: body.nodes || {}, conns: body.conns || [] });
    }
  });
  document.getElementById('cnt-charts').textContent = diagrams.length || '';
  document.getElementById('cnt-hubs').textContent = hubs.length || '';
  showStoreNote();
  try {
    const saved = localStorage.getItem('studio:kind');
    if (saved === 'hubs' || saved === 'charts') kind = saved;
  } catch (e) {}
  switchKind(kind);
}

/* Сколько места занято — чтобы переполнение не стало сюрпризом. */
function showStoreNote() {
  let bytes = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf('studio:') === 0) bytes += (localStorage.getItem(k) || '').length;
    }
  } catch (e) { return; }
  const el = document.getElementById('store-note');
  if (el) el.textContent = 'В браузере · ' + (bytes > 1048576
    ? (bytes / 1048576).toFixed(1) + ' МБ' : Math.max(1, Math.round(bytes / 1024)) + ' КБ');
}

function render() {
  if (kind === 'hubs') renderHubs(); else renderDiagrams();
}

const ACT_EXPORT = '<div class="card-act-btn" data-act="export" title="Выгрузить в файл"><svg viewBox="0 0 13 13"><path d="M2 9v2h9V9M6.5 1.5v6M4 5.5l2.5 2.5L9 5.5"/></svg></div>';
const ACT_RENAME = '<div class="card-act-btn" data-act="rename" title="Переименовать"><svg viewBox="0 0 13 13"><path d="M2 10l1.5-1.5 5-5L10 5l-5 5L3.5 11.5 2 10z"/></svg></div>';
const ACT_DELETE = '<div class="card-act-btn del" data-act="delete" title="Удалить"><svg viewBox="0 0 13 13"><path d="M2 3.5h9M5 3.5V2h3v1.5M4 3.5l.6 7.5h3.8l.6-7.5"/></svg></div>';

function newCard(label, fn) {
  const nc = document.createElement('div');
  nc.className = 'new-card';
  nc.innerHTML = '<div class="new-card-icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg></div><span>' + esc(label) + '</span>';
  nc.onclick = fn;
  return nc;
}

function renderDiagrams() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  document.getElementById('loading').style.display = 'none';
  document.getElementById('page-sub').textContent =
    diagrams.length + ' ' + plural(diagrams.length, 'схема','схемы','схем');
  if (!diagrams.length) {
    empty.style.display = 'flex';
    grid.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  grid.style.display = 'grid';
  grid.innerHTML = '';
  grid.appendChild(newCard('Новая схема', createDiagram));

  diagrams.forEach(function(d) {
    const card = document.createElement('div');
    card.className = 'diag-card';
    const date = new Date(d.updated_at).toLocaleDateString('ru', {day:'numeric', month:'short', year:'numeric'});
    const nodesArr = Object.values(d.nodes || {});
    card.innerHTML =
      '<div class="card-preview">' + buildPreview(nodesArr, d.conns || []) + '</div>' +
      '<div class="card-actions">' +
        ACT_EXPORT + ACT_RENAME + ACT_DELETE +
      '</div>' +
      '<div class="card-body">' +
        '<div class="card-title">' + esc(d.title) + '</div>' +
        '<div class="card-meta">' + nodesArr.length + ' ' + plural(nodesArr.length, 'блок','блока','блоков') + ' · ' + date + '</div>' +
      '</div>';
    card.onclick = function(e) {
      const act = e.target.closest('[data-act]');
      if (act) {
        e.stopPropagation();
        const t = act.getAttribute('data-act');
        if (t === 'export') exportOne(d.id);
        if (t === 'rename') startRename('charts', d.id, d.title);
        if (t === 'delete') removeDoc('charts', d.id);
        return;
      }
      window.location.href = 'editor.html?id=' + d.id;
    };
    grid.appendChild(card);
  });
}

function renderHubs() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  document.getElementById('loading').style.display = 'none';

  document.getElementById('page-sub').textContent =
    hubs.length + ' ' + plural(hubs.length, 'хаб','хаба','хабов');
  if (!hubs.length) {
    empty.style.display = 'flex';
    grid.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  grid.style.display = 'grid';
  grid.innerHTML = '';
  grid.appendChild(newCard('Новый хаб', createHub));

  hubs.forEach(function(h) {
    const card = document.createElement('div');
    card.className = 'diag-card';
    const date = new Date(h.updated_at).toLocaleDateString('ru', {day:'numeric', month:'short', year:'numeric'});
    const doc = h.doc || {};
    const secs = doc.sections || [];
    let tiles = 0;
    secs.forEach(function(s) { tiles += (s.tiles || []).length; });
    card.innerHTML =
      '<div class="card-preview">' + hubPreview(secs) + '</div>' +
      '<div class="card-actions">' + ACT_EXPORT + ACT_RENAME + ACT_DELETE + '</div>' +
      '<div class="card-body">' +
        '<div class="card-title">' + esc(h.title) + '</div>' +
        '<div class="card-meta">' + secs.length + ' ' + plural(secs.length, 'секция','секции','секций') +
          ' · ' + tiles + ' ' + plural(tiles, 'плитка','плитки','плиток') + ' · ' + date +
        '</div>' +
      '</div>';
    card.onclick = function(e) {
      const act = e.target.closest('[data-act]');
      if (act) {
        e.stopPropagation();
        const t = act.getAttribute('data-act');
        if (t === 'export') exportOne(h.id);
        if (t === 'rename') startRename('hubs', h.id, h.title);
        if (t === 'delete') removeDoc('hubs', h.id);
        return;
      }
      window.location.href = 'hub.html?id=' + h.id;
    };
    grid.appendChild(card);
  });
}

/* Схематичное превью хаба: кикер, заголовок и по строке на секцию. */
function hubPreview(secs) {
  let rows = '';
  secs.slice(0, 3).forEach(function(s) {
    const n = Math.min((s.tiles || []).length || 2, 3);
    let t = '';
    for (let i = 0; i < n; i++) t += '<div class="hp-tile"></div>';
    rows += '<div class="hp-row"><div class="hp-bar" style="background:' +
      esc(s.accent || '#5B4670') + '"></div>' + t + '</div>';
  });
  if (!rows) rows = '<div class="hp-row"><div class="hp-tile"></div><div class="hp-tile"></div></div>';
  return '<div class="hub-prev"><div class="hp-kick"></div><div class="hp-h1"></div>' + rows + '</div>';
}

function buildPreview(nodes, conns) {
  if (!nodes.length) {
    return '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--t3);font-size:12px">Пустая схема</div>';
  }
  const pad = 16;
  const minX = Math.min.apply(null, nodes.map(function(n){return n.x;}));
  const minY = Math.min.apply(null, nodes.map(function(n){return n.y;}));
  const maxX = Math.max.apply(null, nodes.map(function(n){return n.x+200;}));
  const maxY = Math.max.apply(null, nodes.map(function(n){return n.y+70;}));
  const W = maxX - minX + pad*2;
  const H = maxY - minY + pad*2;

  let svgNodes = '';
  let defs = '';
  nodes.slice(0, 20).forEach(function(n, i) {
    const c1 = ha(n.color, .5);
    const c2 = ha(n.color, .9);
    const gid = 'pg' + i;
    defs += '<linearGradient id="' + gid + '" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="' + c1 + '"/><stop offset="100%" stop-color="' + c2 + '"/></linearGradient>';
    const x = ((n.x - minX + pad) / W * 100).toFixed(1);
    const y = ((n.y - minY + pad) / H * 100).toFixed(1);
    const w = (200 / W * 100).toFixed(1);
    const h = (46 / H * 100).toFixed(1);
    svgNodes += '<rect x="' + x + '%" y="' + y + '%" width="' + w + '%" height="' + h + '%" rx="2" fill="url(#' + gid + ')" opacity=".9"/>';
  });

  let svgLines = '';
  const nm = {};
  nodes.forEach(function(n){ nm[n.id] = n; });
  (conns || []).slice(0, 30).forEach(function(c) {
    const p = nm[c.from], ch = nm[c.to];
    if (!p || !ch) return;
    const px = ((p.x - minX + pad + 100) / W * 100).toFixed(1);
    const py = ((p.y - minY + pad + 46) / H * 100).toFixed(1);
    const cx = ((ch.x - minX + pad + 100) / W * 100).toFixed(1);
    const cy = ((ch.y - minY + pad) / H * 100).toFixed(1);
    svgLines += '<line x1="' + px + '%" y1="' + py + '%" x2="' + cx + '%" y2="' + cy + '%" stroke="rgba(0,0,0,.15)" stroke-width=".8"/>';
  });

  return '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%"><defs>' + defs + '</defs>' + svgLines + svgNodes + '</svg>';
}

function ha(hex, a) {
  try {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  } catch(e) { return hex; }
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function plural(n, a, b, c) {
  const v = Math.abs(n) % 100;
  const v1 = v % 10;
  if (v > 10 && v < 20) return c;
  if (v1 > 1 && v1 < 5) return b;
  if (v1 === 1) return a;
  return c;
}

function createDiagram() {
  const id = newId();
  if (!putDoc(id, 'chart', 'Без названия', {nodes: {}, conns: []})) return;
  window.location.href = 'editor.html?id=' + id;
}

function createHub() {
  const id = newId();
  if (!putDoc(id, 'hub', 'Новый хаб', {})) return;
  window.location.href = 'hub.html?id=' + id;
}

function startRename(k, id, title) {
  renameId = id;
  document.getElementById('rename-input').value = title;
  document.getElementById('rename-modal').classList.add('open');
  setTimeout(function(){ document.getElementById('rename-input').focus(); }, 50);
}
function closeRename() {
  document.getElementById('rename-modal').classList.remove('open');
  renameId = null;
}
function confirmRename() {
  const title = document.getElementById('rename-input').value.trim();
  if (!title || !renameId) return;
  const row = docIndex().filter(function(d){ return d.id === renameId; })[0];
  const body = docBody(renameId);
  if (row && body) putDoc(renameId, row.kind, title, body);
  closeRename();
  loadAll();
  toast('Переименовано');
}

function removeDoc(k, id) {
  const isHub = k === 'hubs';
  if (!confirm(isHub
    ? 'Удалить хаб? Он есть только в этом браузере — восстановить можно будет лишь из файла.'
    : 'Удалить схему? Она есть только в этом браузере — восстановить можно будет лишь из файла.')) return;
  dropDoc(id);
  loadAll();
  toast(isHub ? 'Хаб удалён' : 'Схема удалена');
}

/* ═══ Файлы ══════════════════════════════════════════════ */

function slug(str) {
  const map = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',
    н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',
    ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
  const out = String(str || '').toLowerCase().split('').map(function(c){
    return map[c] !== undefined ? map[c] : c;
  }).join('').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  return out || 'studio';
}

function download(name, text) {
  const blob = new Blob([text], {type: 'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

/* Один документ — им удобно обмениваться. */
function exportOne(id) {
  const row = docIndex().filter(function(d){ return d.id === id; })[0];
  const body = docBody(id);
  if (!row || !body) { toast('Документ не найден'); return; }
  download(slug(row.title) + '.json', JSON.stringify(
    {studio: 1, kind: row.kind, id: row.id, title: row.title, updated: row.updated, doc: body}, null, 2));
  toast('Файл сохранён');
}

/* Все документы разом — это и есть резервная копия. */
function exportAll() {
  const docs = docIndex().map(function(row) {
    const body = docBody(row.id);
    return body ? {kind: row.kind, id: row.id, title: row.title, updated: row.updated, doc: body} : null;
  }).filter(Boolean);
  if (!docs.length) { toast('Пока нечего сохранять'); return; }
  const stamp = new Date().toISOString().slice(0, 10);
  download('studio-backup-' + stamp + '.json', JSON.stringify({studio: 1, docs: docs}, null, 2));
  toast('Сохранено документов: ' + docs.length);
}

/* Принимает и одиночный документ, и полную резервную копию. */
function importFile(file) {
  const rd = new FileReader();
  rd.onload = function() {
    let data;
    try { data = JSON.parse(rd.result); }
    catch (e) { toast('Файл не читается как JSON'); return; }
    const items = data && Array.isArray(data.docs) ? data.docs
                : (data && data.doc ? [data] : null);
    if (!items) { toast('Это не файл Studio'); return; }

    /* Тот же документ обновляем, только если файл новее — тогда
       повторный импорт одной и той же копии ничего не портит
       и не плодит дубликаты. */
    const known = {};
    docIndex().forEach(function(d){ known[d.id] = d; });
    let added = 0, updated = 0, skipped = 0;

    items.forEach(function(it) {
      if (!it || !it.doc) return;
      const k = it.kind === 'hub' ? 'hub' : 'chart';
      const title = it.title || 'Без названия';
      const prev = it.id ? known[it.id] : null;

      if (!prev) {
        const id = it.id || newId();
        if (putDoc(id, k, title, it.doc)) { known[id] = {id: id, updated: it.updated || Date.now()}; added++; }
        return;
      }
      if (!(it.updated && it.updated > prev.updated)) { skipped++; return; }
      if (putDoc(it.id, k, title, it.doc)) { prev.updated = it.updated; updated++; }
    });

    loadAll();
    const parts = [];
    if (added) parts.push('добавлено ' + added);
    if (updated) parts.push('обновлено ' + updated);
    if (skipped) parts.push('без изменений ' + skipped);
    toast(parts.length ? parts.join(', ') : 'Ничего не изменилось');
  };
  rd.readAsText(file);
}

let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.classList.remove('show'); }, 3500);
}

document.getElementById('rename-modal').addEventListener('click', function(e) {
  if (e.target === document.getElementById('rename-modal')) closeRename();
});
document.getElementById('rename-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') confirmRename();
  if (e.key === 'Escape') closeRename();
});

document.getElementById('file-in').addEventListener('change', function(e) {
  const f = e.target.files[0];
  if (f) importFile(f);
  e.target.value = '';
});

loadAll();
</script>
