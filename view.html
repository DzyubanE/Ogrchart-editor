<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0efeb;--bg2:#f5f4f1;--b1:rgba(0,0,0,.07);--b2:rgba(0,0,0,.13);
  --t1:#111;--t2:#555;--t3:#999;--accent:#3730a3;
  --sh:0 1px 3px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.07);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1d2125;--bg2:#252a2f;--b1:rgba(255,255,255,.07);--b2:rgba(255,255,255,.13);
    --t1:#e6e4de;--t2:#9a9790;--t3:#5a5855;--sh:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  }
}
html,body{height:100%;font-family:'Geist',system-ui,sans-serif;background:var(--bg);color:var(--t1);overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
.hdr{height:52px;display:flex;align-items:center;padding:0 24px;gap:10px;background:var(--bg);border-bottom:1px solid var(--b1);flex-shrink:0;position:relative}
.hdr-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-mark svg{width:13px;height:13px}
.hdr-title{font-size:13px;font-weight:700;letter-spacing:-.02em}
.hdr-right{margin-left:auto;font-size:11px;color:var(--t3)}
.hdr-tip{position:absolute;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.62);color:#fff;font-size:11.5px;padding:5px 16px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .5s;z-index:99;white-space:nowrap}
.body{flex:1;overflow:hidden;position:relative;background:var(--bg);cursor:grab}
#stage{position:absolute;transform-origin:top left}
#svg-lines{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1}
.onode{position:absolute;width:200px;border-radius:14px;background:var(--bg);border:1.5px solid var(--b1);box-shadow:var(--sh);cursor:pointer;overflow:hidden;transition:transform .18s cubic-bezier(.16,1,.3,1),box-shadow .18s,border-color .18s}
.onode:active{transform:scale(.98)}
.onode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.onode.active{border-color:var(--accent) !important;box-shadow:0 4px 20px rgba(0,0,0,.12),0 0 0 3px rgba(55,48,163,.15) !important}
.onode.onode-group{border-radius:18px;min-width:140px;max-width:320px}
.on-head{padding:11px 12px 11px;display:flex;align-items:center;gap:8px}
.onode-group .on-head{padding:14px 14px 13px}
.on-texts{flex:1;min-width:0}
.on-role{font-size:12.5px;font-weight:700;color:#fff;line-height:1.3;overflow-wrap:break-word}
.onode-group .on-role{font-size:13.5px}
.on-dept{font-size:10.5px;color:rgba(255,255,255,.7);margin-top:2px;overflow-wrap:break-word}
.on-arr{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .25s,background .15s}
.onode-group .on-arr{border-radius:8px}
.on-arr svg{width:8px;height:8px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.onode.active .on-arr{transform:rotate(90deg);background:rgba(255,255,255,.35)}
.dp{position:fixed;z-index:200;width:308px;max-width:calc(100vw - 40px);background:var(--bg);border:1px solid var(--b2);border-radius:18px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.16);pointer-events:none;opacity:0;transform:scale(.96) translateX(-6px);transition:opacity .2s,transform .22s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column}
.dp.open{opacity:1;transform:scale(1) translateX(0);pointer-events:auto}
.dp-bar{height:4px;flex-shrink:0}
.dp-head{padding:15px 16px 11px;position:relative;flex-shrink:0;border-bottom:1px solid var(--b1)}
.dp-x{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:8px;background:var(--bg2);border:1px solid var(--b1);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s cubic-bezier(.16,1,.3,1)}
.dp-x:active{transform:scale(.9)}
.dp-x svg{width:10px;height:10px;stroke:var(--t2);fill:none;stroke-width:2;stroke-linecap:round}
.dp-role{font-size:14.5px;font-weight:700;letter-spacing:-.02em;color:var(--t1);padding-right:28px;line-height:1.3}
.dp-dept{font-size:11.5px;color:var(--t2);margin-top:3px}
.dp-sched{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:3px 10px;border-radius:20px;background:var(--bg2);border:1px solid var(--b1);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--t3)}
.dp-sd{width:5px;height:5px;border-radius:50%;flex-shrink:0;display:inline-block}
.dp-body{padding:2px 16px 18px;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--b2) transparent}
.dp-body::-webkit-scrollbar{width:6px}
.dp-body::-webkit-scrollbar-track{background:transparent}
.dp-body::-webkit-scrollbar-thumb{background:var(--b2);border-radius:10px}
.dp-slb{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin:13px 0 7px}
.dp-duty{display:flex;gap:9px;padding:5px 0;border-bottom:1px solid var(--b1);font-size:12px;color:var(--t2);line-height:1.5}
.dp-duty:last-of-type{border-bottom:none}
.dp-dd{width:4px;height:4px;border-radius:50%;margin-top:6px;flex-shrink:0}
.dp-emp{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:6px;background:var(--bg2);border:1px solid var(--b1);border-radius:11px}
.dp-emp:last-child{margin-bottom:0}
.dp-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;overflow:hidden}
.dp-av img{width:100%;height:100%;object-fit:cover}
.dp-en{font-size:12.5px;font-weight:600;color:var(--t1)}
.dp-eid{font-size:11px;color:var(--t2);margin-top:3px;display:flex;align-items:center;gap:5px}
.reddy-ic{width:16px;height:16px;border-radius:50%;object-fit:cover;flex-shrink:0}
.dp-none{font-size:11.5px;color:var(--t3);font-style:italic;padding:6px 0}
.zoom-ctrl{position:fixed;top:68px;right:16px;z-index:100;display:flex;flex-direction:column;gap:4px}
.zoom-ctrl button{width:32px;height:32px;border-radius:8px;font-size:16px;font-weight:600;background:var(--bg);border:1px solid var(--b2);color:var(--t1);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh);transition:transform .15s cubic-bezier(.16,1,.3,1)}
.zoom-ctrl button:active{transform:scale(.92)}
.err{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;color:var(--t3);padding:20px;text-align:center}
.err-icon{width:56px;height:56px;border-radius:14px;background:var(--bg2);display:flex;align-items:center;justify-content:center}
.err-icon svg{width:26px;height:26px;stroke:var(--t3);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.err-title{font-size:18px;font-weight:700;color:var(--t1)}
.err-sub{font-size:13px}

.onode.onode-static{cursor:default}

@media(hover:hover) and (pointer:fine){
  .onode:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.12)}
  .onode.onode-static:hover{transform:none;box-shadow:var(--sh)}
  .zoom-ctrl button:hover{background:var(--bg2)}
}

@media(max-width:640px){
  .hdr{padding:0 14px}
  .hdr-title{font-size:12px}
  .hdr-right{display:none}
  .zoom-ctrl{top:60px;right:10px}
  .zoom-ctrl button{width:30px;height:30px;font-size:14px}
  .dp{width:calc(100vw - 16px);left:8px !important;right:8px}
}
</style>
</head>

let NODES = [], CONNS = [];
let W = 0, H = 0;
let vx = 0, vy = 0, zoom = 1, activeId = null;
const body = document.getElementById('body');
const stage = document.getElementById('stage');

function applyT() {
  stage.style.transform = 'translate(' + vx + 'px,' + vy + 'px) scale(' + zoom + ')';
}

function fitV() {
  if (!W || !H) return;
  const r = body.getBoundingClientRect();
  zoom = Math.min(1.5, Math.max(.1, Math.min((r.width - 80) / W, (r.height - 40) / H)));
  vx = (r.width - W * zoom) / 2;
  vy = 16;
  applyT();
  document.getElementById('zlbl').textContent = Math.round(zoom * 100) + '%';
}

function chgZ(d) {
  const r = body.getBoundingClientRect();
  const nz = Math.min(3, Math.max(.2, zoom + d));
  const sc = nz / zoom;
  vx = r.width / 2 - sc * (r.width / 2 - vx);
  vy = r.height / 2 - sc * (r.height / 2 - vy);
  zoom = nz;
  applyT();
  document.getElementById('zlbl').textContent = Math.round(zoom * 100) + '%';
}

let panning = false, panSX = 0, panSY = 0;

body.addEventListener('mousedown', function(e) {
  if ((e.button === 0 && !e.target.closest('.onode') && !e.target.closest('.dp')) || e.button === 1) {
    panning = true;
    panSX = e.clientX - vx;
    panSY = e.clientY - vy;
    body.style.cursor = 'grabbing';
    e.preventDefault();
  }
});

document.addEventListener('mousemove', function(e) {
  if (!panning) return;
  const r = body.getBoundingClientRect();
  const pad = 60;
  vx = Math.min(pad, Math.max(r.width - W * zoom - pad, e.clientX - panSX));
  vy = Math.min(pad, Math.max(r.height - H * zoom - pad, e.clientY - panSY));
  applyT();
});

document.addEventListener('mouseup', function() {
  if (panning) {
    panning = false;
    body.style.cursor = 'grab';
  }
});

function zoomAt(cx, cy, d) {
  const nz = Math.min(3, Math.max(.2, zoom + d));
  const sc = nz / zoom;
  vx = cx - sc * (cx - vx);
  vy = cy - sc * (cy - vy);
  zoom = nz;
  applyT();
  document.getElementById('zlbl').textContent = Math.round(zoom * 100) + '%';
}

body.addEventListener('wheel', function(e) {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    const r = body.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY > 0 ? -.08 : .08);
  }
}, {passive: false});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeDP();
});

  let lastDist = 0;
  body.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) {
      lastDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, {passive: true});
  body.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2) {
      e.preventDefault();
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      if (lastDist > 0) {
        const delta = (dist - lastDist) * 0.008;
        const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const r = body.getBoundingClientRect();
        zoomAt(cx - r.left, cy - r.top, delta);
      }
      lastDist = dist;
    }
  }, {passive: false});
  body.addEventListener('touchend', function() { lastDist = 0; }, {passive: true});

  let panT = false, panTX = 0, panTY = 0;
  body.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1 && !e.target.closest('.onode') && !e.target.closest('.dp')) {
      panT = true;
      panTX = e.touches[0].clientX - vx;
      panTY = e.touches[0].clientY - vy;
    }
  }, {passive: true});
  body.addEventListener('touchmove', function(e) {
    if (panT && e.touches.length === 1) {
      const r = body.getBoundingClientRect();
      const pad = 60;
      vx = Math.min(pad, Math.max(r.width - W * zoom - pad, e.touches[0].clientX - panTX));
      vy = Math.min(pad, Math.max(r.height - H * zoom - pad, e.touches[0].clientY - panTY));
      applyT();
    }
  }, {passive: true});
  body.addEventListener('touchend', function() { panT = false; }, {passive: true});
})();

function ha(h, a) {
  try {
    const r = parseInt(h.slice(1,3), 16);
    const g = parseInt(h.slice(3,5), 16);
    const b = parseInt(h.slice(5,7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  } catch(e) { return h; }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function groupCardWidth(roleText, hasArrow) {
  const probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;left:-9999px;top:-9999px;font-family:Geist,system-ui,sans-serif;font-weight:700;font-size:13.5px';
  probe.textContent = roleText;
  document.body.appendChild(probe);
  const textW = probe.offsetWidth;
  probe.remove();
  const extra = 28 + (hasArrow ? 28 : 0);
  return Math.max(140, Math.min(320, Math.ceil(textW + extra)));
}

function init() {
  const pad = 40;
  const minX = Math.min.apply(null, NODES.map(function(n){return n.x;}));
  const minY = Math.min.apply(null, NODES.map(function(n){return n.y;}));
  NODES = NODES.map(function(n){
    return Object.assign({}, n, {x: n.x - minX + pad, y: n.y - minY + pad});
  });

  NODES.forEach(function(d) {
    const el = document.createElement('div');
    const expandable = !(d.kind === 'group' && !d.desc);
    el.className = d.kind === 'group' ? 'onode onode-group' : 'onode';
    if (!expandable) el.classList.add('onode-static');
    el.id = d.id;
    if (expandable) {
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.setAttribute('aria-label', 'Подробнее: ' + d.role);
    }
    el.style.left = d.x + 'px';
    el.style.top = d.y + 'px';
    const c1 = ha(d.color, .5);
    const c2 = ha(d.color, .93);
    const subtitle = d.kind === 'group' ? esc(d.dept) : (esc(d.dept) + ' \u00B7 ' + esc(d.sched));
    const subtitleHtml = subtitle ? '<div class="on-dept">' + subtitle + '</div>' : '';
    const arrHtml = expandable
      ? '<div class="on-arr"><svg viewBox="0 0 8 8" fill="none"><path d="M2 1.5l3.5 3L2 7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'
      : '';
    const centerText = d.kind === 'group' && !d.dept && !d.desc;
    el.innerHTML =
      '<div class="on-head" style="background:linear-gradient(135deg,' + c1 + ',' + c2 + ')">' +
      '<div class="on-texts"' + (centerText ? ' style="text-align:center"' : '') + '><div class="on-role">' + esc(d.role) + '</div>' +
      subtitleHtml + '</div>' +
      arrHtml +
      '</div>';
    if (d.kind === 'group') el.style.width = groupCardWidth(d.role, expandable) + 'px';
    if (!expandable) { stage.appendChild(el); return; }
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      openNode(d.id);
    });
    el.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openNode(d.id);
      }
    });
    stage.appendChild(el);
  });

  const maxX = Math.max.apply(null, NODES.map(function(n){
    const el = document.getElementById(n.id);
    return n.x + (el ? el.offsetWidth : 200);
  }));
  const maxY = Math.max.apply(null, NODES.map(function(n){
    const el = document.getElementById(n.id);
    return n.y + (el ? el.offsetHeight : 70);
  }));
  W = maxX + pad;
  H = maxY + pad;
  stage.style.width = W + 'px';
  stage.style.height = H + 'px';

  drawLines();
  setTimeout(function() {
    fitV();
    const hint = document.getElementById('hdr-tip');
    if (hint) {
      hint.style.opacity = '1';
      setTimeout(function(){ hint.style.opacity = '0'; }, 3500);
    }
  }, 100);
}

function openNode(id) {
  if (activeId === id) { closeDP(); return; }
  document.querySelectorAll('.onode.active').forEach(function(n){ n.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  activeId = id;
  const d = NODES.find(function(n){ return n.id === id; });
  if (!d) return;
  document.getElementById('dp-bar').style.background = d.color;
  document.getElementById('dp-role').textContent = d.role;
  document.getElementById('dp-dept').textContent = d.dept;
  document.getElementById('dp-sd').style.background = d.color;
  document.getElementById('dp-st').textContent = 'График ' + d.sched;
  document.getElementById('dp-sched-box').style.display = d.kind === 'group' ? 'none' : 'inline-flex';

  if (d.kind === 'group') {
    document.getElementById('dp-slb-duties').textContent = 'Описание';
    document.getElementById('dp-duties').innerHTML = d.desc
      ? '<div style="font-size:12px;color:var(--t2);line-height:1.6;padding:2px 0">' + esc(d.desc) + '</div>'
      : '<div class="dp-none">—</div>';
    document.getElementById('dp-slb-emps').style.display = 'none';
    document.getElementById('dp-emps').innerHTML = '';
  } else {
    document.getElementById('dp-slb-duties').textContent = 'Обязанности';
    document.getElementById('dp-duties').innerHTML = d.duties && d.duties.length
      ? d.duties.map(function(t){
          return '<div class="dp-duty"><span class="dp-dd" style="background:' + esc(d.color) + '"></span>' + esc(t) + '</div>';
        }).join('')
      : '<div class="dp-none">—</div>';

    const empSlb = document.getElementById('dp-slb-emps');
    const empDiv = document.getElementById('dp-emps');
    if (d.emps === null || d.emps === undefined) {
      empSlb.style.display = 'none';
      empDiv.innerHTML = '';
    } else {
      empSlb.style.display = 'block';
      empDiv.innerHTML = d.emps.length === 0
        ? '<div class="dp-none">Список уточняется</div>'
        : d.emps.map(function(e) {
            const ini = (e.name || '').split(' ').map(function(w){ return w[0] || ''; }).join('').slice(0,2).toUpperCase();
            const avHtml = e.avatar ? '<img src="' + esc(e.avatar) + '" alt="">' : ini;
            const reddyHtml = e.reddy ? '<div class="dp-eid"><img class="reddy-ic" src="' + REDDY + '" alt="Reddy">' + esc(e.reddy) + '</div>' : '';
            return '<div class="dp-emp"><div class="dp-av" style="background:' + ha(d.color, .13) + ';color:' + esc(d.color) + '">' + avHtml + '</div>' +
                   '<div><div class="dp-en">' + esc(e.name || '') + '</div>' + reddyHtml + '</div></div>';
          }).join('');
    }
  }
  posDP(id);
  document.getElementById('dp').classList.add('open');
  drawLines();
  setTimeout(function(){
    const closeBtn = document.querySelector('#dp .dp-x');
    if (closeBtn) closeBtn.focus();
  }, 50);
}

function posDP(id) {
  const d = NODES.find(function(n){ return n.id === id; });
  if (!d) return;
  const MARGIN = 24; // keeps the panel's own drop shadow clear of the viewport/embed edge
  const r = body.getBoundingClientRect();
  const cw = document.getElementById(id)?.offsetWidth || 200;
  const nx = (d.x + cw) * zoom + vx + r.left;
  const ny = d.y * zoom + vy + r.top;
  let left = nx + 12;
  if (left + 320 > window.innerWidth - MARGIN) left = Math.max(MARGIN, nx - cw * zoom - 328);
  left = Math.max(MARGIN, left);
  const dp = document.getElementById('dp');
  // Cap height to what actually fits — .dp-body scrolls internally past this instead of the panel overflowing the viewport
  dp.style.maxHeight = Math.max(160, window.innerHeight - MARGIN * 2) + 'px';
  dp.style.left = left + 'px';
  const top = Math.max(r.top + 8, MARGIN, ny);
  dp.style.top = top + 'px';
  // offsetHeight forces a layout read (unaffected by the open-transition's transform/opacity animation,
  // unlike getBoundingClientRect mid-transition) so this height is accurate right away — no rAF needed.
  const h = dp.offsetHeight;
  if (top + h > window.innerHeight - MARGIN) {
    dp.style.top = Math.max(MARGIN, window.innerHeight - MARGIN - h) + 'px';
  }
}

function closeDP() {
  const wasActiveId = activeId;
  document.getElementById('dp').classList.remove('open');
  document.querySelectorAll('.onode.active').forEach(function(n){ n.classList.remove('active'); });
  activeId = null;
  drawLines();
  if (wasActiveId) {
    const trigger = document.getElementById(wasActiveId);
    if (trigger) trigger.focus();
  }
}

body.addEventListener('click', function(e) {
  if (!e.target.closest('.onode') && !e.target.closest('.dp')) closeDP();
});

function nbox(id) {
  const el = document.getElementById(id);
  const d = NODES.find(function(n){ return n.id === id; });
  if (!el || !d) return null;
  return {cx: d.x + el.offsetWidth / 2, top: d.y, bot: d.y + el.offsetHeight};
}

function drawLines() {
  const svg = document.getElementById('svg-lines');
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  const dark = window.matchMedia('(prefers-color-scheme:dark)').matches;
  const defSt = dark ? 'rgba(255,255,255,0.28)' : 'rgba(0,0,0,0.15)';
  const aSet = new Set();
  if (activeId) {
    CONNS.forEach(function(c) {
      if (c.from === activeId || c.to === activeId) aSet.add(c.from + '>' + c.to);
    });
  }
  const seen = new Set();
  let defs = '<defs><marker id="ah" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5L8 5L1 8.5" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="context-stroke"/></marker>';
  let paths = '';
  let gi = 0;
  CONNS.forEach(function(c) {
    const k = c.from + '>' + c.to;
    if (seen.has(k)) return;
    seen.add(k);
    const p = nbox(c.from);
    const ch = nbox(c.to);
    if (!p || !ch) return;
    const my = (p.bot + ch.top) / 2;
    const isA = aSet.has(k);
    if (isA) {
      const srcN = NODES.find(function(n){ return n.id === c.from; });
      const tgtN = NODES.find(function(n){ return n.id === c.to; });
      const sc = esc((srcN && srcN.color) || '#3b82f6');
      const tc = esc((tgtN && tgtN.color) || '#3b82f6');
      const gid = 'g' + gi++;
      defs += '<linearGradient id="' + gid + '" x1="' + p.cx + '" y1="' + p.bot + '" x2="' + ch.cx + '" y2="' + ch.top + '" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="' + sc + '"/><stop offset="100%" stop-color="' + tc + '"/></linearGradient>';
      defs += '<marker id="ah-' + gid + '" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5L8 5L1 8.5" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke="' + tc + '"/></marker>';
      paths += '<path d="M' + p.cx + ',' + p.bot + ' C' + p.cx + ',' + my + ' ' + ch.cx + ',' + my + ' ' + ch.cx + ',' + ch.top + '" fill="none" stroke="url(#' + gid + ')" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-' + gid + ')"/>';
    } else {
      const st = esc(c.color || defSt);
      paths += '<path d="M' + p.cx + ',' + p.bot + ' C' + p.cx + ',' + my + ' ' + ch.cx + ',' + my + ' ' + ch.cx + ',' + ch.top + '" fill="none" stroke="' + st + '" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)"/>';
    }
  });
  svg.innerHTML = defs + '</defs>' + paths;
}

let rf;
function sd() {
  cancelAnimationFrame(rf);
  rf = requestAnimationFrame(drawLines);
}
window.addEventListener('resize', sd);

(async function() {
  const token = new URLSearchParams(window.location.search).get('t');
  if (!token) {
    document.getElementById('err-view').style.display = 'flex';
    return;
  }
  try {
    const r = await fetch(SB_URL + '/rest/v1/shares?token=eq.' + token + '&select=diagram_id', {
      headers: {'apikey': SB_KEY}
    });
    const shares = await r.json();
    if (!shares || !shares.length) throw new Error('not found');
    const did = shares[0].diagram_id;
    const r2 = await fetch(SB_URL + '/rest/v1/diagrams?id=eq.' + did + '&select=title,nodes,conns', {
      headers: {'apikey': SB_KEY}
    });
    const diags = await r2.json();
    if (!diags || !diags.length) throw new Error('not found');
    const d = diags[0];
    document.title = d.title + ' · OrgChart';
    document.getElementById('hdr-title').textContent = d.title;
    NODES = Object.values(d.nodes || {});
    CONNS = d.conns || [];
    if (!NODES.length) {
      document.getElementById('err-view').style.display = 'flex';
      return;
    }
    document.getElementById('app').style.display = 'flex';
    init();
  } catch (e) {
    document.getElementById('err-view').style.display = 'flex';
  }
})();
</script>
</body>
